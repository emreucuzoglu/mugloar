server:
  port: 8080

spring:
  application:
    name: mugloar-backend
  mvc:
    problemdetails:
      enabled: true

mugloar:
  base-url: https://dragonsofmugloar.com/api/v2
  connect-timeout: 5s
  read-timeout: 15s
  read-attempts: 3
  min-request-interval: 340ms
  cors-origins:
    - http://localhost:5173
    - http://localhost:4173
    - http://127.0.0.1:5173
    - http://127.0.0.1:4173
  max-sessions: 200
  selector:
    min-chance-healthy: 0
    min-chance-wounded: 0
    min-chance-critical: 0
    life-cost: 150
  shopping:
    heal-below-lives: 3
    gold-reserve: 50
    # 0 means +1 level items are never bought; raise it to allow them before that turn.
    small-upgrades-until-turn: 0
    upgrades-until-turn: 70
  solver:
    games: 1
    target-score: 0
    max-moves: 2000
